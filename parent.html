<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بوابة ولي الأمر — المنظومة الرقمية</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2545">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2545;--sky:#1a78c2;--gold:#d4920a;--green:#16a34a;--red:#dc2626;--off:#f8f9fc;--line:#e5e7eb;--mid:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--off);min-height:100vh;padding-bottom:80px}
.topbar{background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:30}
.topbar h1{font-size:14px;font-weight:800}
.topbar p{font-size:11px;opacity:.7}
.topbar button{background:rgba(255,255,255,.12);color:#fff;border:none;padding:7px 14px;border-radius:8px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;cursor:pointer}
.page{display:none;padding:16px;max-width:600px;margin:0 auto}
.page.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:900;color:var(--navy);margin-bottom:10px}
.empty{text-align:center;padding:30px;color:#aaa;font-weight:700;font-size:13px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-family:'Cairo',sans-serif;font-size:10px;font-weight:800;color:var(--mid);cursor:pointer}
.nav-btn i{font-size:20px}
.nav-btn.active{color:var(--sky)}
.absent-day{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #f0f2f5;font-size:13px}
.absent-day .date{font-weight:800;color:#111}
.absent-day .status{font-weight:800;font-size:11px}
.status-absent{color:#dc2626}
.status-late{color:#d97706}
.ann-item{padding:8px 0;border-bottom:1px solid #fde68a;font-size:13px;color:#78350f;font-weight:600}
.note-item{padding:10px 0;border-bottom:1px solid #f0f2f5}
.note-teacher{font-weight:800;font-size:12px;color:#111}
.note-date{font-size:10px;color:#aaa;margin-right:8px}
.note-text{font-size:13px;color:#555;margin-top:4px;line-height:1.5}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:10px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;z-index:9999;color:#fff;background:#059669;box-shadow:0 4px 16px rgba(0,0,0,.2)}
@media(max-width:400px){.topbar h1{font-size:12px}}
</style>
</head>
<body>

<div class="topbar">
    <div>
        <h1 id="topbar-name">👨‍👩‍👦 بوابة ولي الأمر</h1>
        <p id="topbar-school"></p>
    </div>
    <button onclick="doLogout()"><i class="bi bi-box-arrow-left"></i> خروج</button>
</div>

<!-- الرئيسية -->
<div class="page active" id="page-home">
    <div class="card">
        <h2><i class="bi bi-person-fill" style="color:var(--sky)"></i> بيانات الطالب</h2>
        <div id="student-info"><div class="empty">⏳ جاري التحميل...</div></div>
    </div>
    <div id="home-announcements"></div>
    <div class="card">
        <h2><i class="bi bi-calendar-x" style="color:var(--red)"></i> سجل الغياب</h2>
        <div id="absence-list"><div class="empty">⏳</div></div>
    </div>
</div>

<!-- ملاحظات المعلمين -->
<div class="page" id="page-notes">
    <div class="card">
        <h2><i class="bi bi-pencil-square" style="color:var(--gold)"></i> ملاحظات المعلمين</h2>
        <div id="teacher-notes"><div class="empty">لا توجد ملاحظات</div></div>
    </div>
</div>

<!-- المراسلات -->
<div class="page" id="page-messages">
    <div class="card">
        <h2><i class="bi bi-envelope" style="color:var(--sky)"></i> المراسلات</h2>
        <p style="font-size:12px;color:var(--mid);font-weight:700">تواصل مع المدير أو رئيس القسم أو الأخصائي</p>
        <div id="parent-messages"><div class="empty">قريباً...</div></div>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-btn active" onclick="switchPage('page-home',this)"><i class="bi bi-house-fill"></i>الرئيسية</button>
    <button class="nav-btn" onclick="switchPage('page-notes',this)"><i class="bi bi-pencil-square"></i>ملاحظات</button>
    <button class="nav-btn" onclick="switchPage('page-messages',this)"><i class="bi bi-envelope"></i>مراسلات</button>
</div>

<script type="module">
import { db, getActiveSchoolId } from './js/firebase-config.js';
import { collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

const saved = localStorage.getItem('hs_parent') || localStorage.getItem('hs_user');
if(!saved) window.location.replace('index.html');
let me = {};
try {
    me = JSON.parse(saved);
    document.getElementById('topbar-name').textContent = '👨‍👩‍👦 ولي أمر — ' + (me.studentName||me.name||'');
    document.getElementById('topbar-school').textContent = me.schoolName||'';
} catch(e) { window.location.replace('index.html'); }

const schoolId = me.schoolId || getActiveSchoolId();

window.switchPage = function(pageId, btn) {
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById(pageId)?.classList.add('active');
    if(btn) btn.classList.add('active');
};

window.doLogout = function() {
    localStorage.removeItem('hs_parent');
    localStorage.removeItem('hs_user');
    window.location.replace('index.html');
};

// تحميل بيانات الطالب
(async function() {
    try {
        const studentName = me.studentName || '';
        const classId = me.classId || '';

        // بيانات الطالب
        const infoDiv = document.getElementById('student-info');
        infoDiv.innerHTML = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px">' +
            '<div><span style="color:var(--mid);font-weight:700">الاسم:</span> <b>'+studentName+'</b></div>' +
            '<div><span style="color:var(--mid);font-weight:700">الفصل:</span> <b>'+classId+'</b></div>' +
            '</div>';

        // سجل الغياب
        if(studentName) {
            const attSnap = await getDocs(query(collection(db,'attendance'), where('schoolId','==',schoolId), where('studentName','==',studentName)));
            const records = attSnap.docs.map(d=>d.data()).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
            const absList = document.getElementById('absence-list');

            if(!records.length) {
                absList.innerHTML = '<div class="empty" style="color:var(--green)">✅ لا يوجد غياب مسجّل — ممتاز!</div>';
            } else {
                const labels = {absent:'غائب',late:'متأخر',excused:'مستأذن'};
                absList.innerHTML = records.map(r =>
                    '<div class="absent-day"><span class="date">'+r.date+'</span><span class="status status-'+(r.status||'absent')+'">'+(labels[r.status]||r.status)+'</span><span style="font-size:11px;color:var(--mid)">'+(r.period||'')+'</span></div>'
                ).join('');
            }

            // ملاحظات المعلمين
            const notesSnap = await getDocs(query(collection(db,'student_notes'), where('schoolId','==',schoolId), where('studentName','==',studentName)));
            const notesDiv = document.getElementById('teacher-notes');
            if(notesSnap.size > 0) {
                const notes = notesSnap.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
                notesDiv.innerHTML = notes.map(n =>
                    '<div class="note-item"><span class="note-teacher">'+n.teacherName+'</span><span class="note-date">'+n.date+'</span><div class="note-text">'+n.note+'</div></div>'
                ).join('');
            }
        }

        // إعلانات المدرسة
        const annSnap = await getDocs(query(collection(db,'school_announcements'), where('schoolId','==',schoolId), where('active','==',true)));
        if(annSnap.size > 0) {
            document.getElementById('home-announcements').innerHTML =
                '<div class="card" style="background:#fef3c7;border-color:#fbbf24"><h2 style="color:#92400e">📢 إعلانات المدرسة</h2>' +
                annSnap.docs.map(d=>'<div class="ann-item">'+d.data().text+'</div>').join('') + '</div>';
        }

    } catch(e) { console.error('Parent load:', e); }
})();

if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>

</body>
</html>
