<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تسجيل الدخول | المنظومة الرقمية</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#0b2545">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./logo.png">
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2545;--sky:#1a78c2;--gold:#d4920a;--red:#dc2626;--green:#16a34a;--mid:#6b7280;--line:#e5e7eb;--off:#f8f9fc}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Cairo",sans-serif}
body{background:var(--navy);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:440px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.school-header{background:var(--navy);padding:28px 24px 22px;text-align:center}
.school-logo{width:72px;height:72px;border-radius:16px;margin:0 auto 12px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden}
.school-logo img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.school-name{font-size:17px;font-weight:900;color:#fff;margin-bottom:4px}
.school-sub{font-size:11px;color:rgba(255,255,255,.6);font-weight:700}
.school-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-top:10px}
.login-body{padding:28px 24px 16px}
.error-msg{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:10px 14px;border-radius:8px;font-size:13px;font-weight:700;margin-bottom:14px;display:none;text-align:center}
.error-msg.show{display:block}
.login-label{font-size:12px;font-weight:800;color:var(--mid);display:block;margin-bottom:6px}
.login-input{width:100%;padding:13px 16px;border:2px solid var(--line);border-radius:10px;font-family:"Cairo",sans-serif;font-size:14px;font-weight:700;color:#111;background:var(--off);outline:none;transition:border-color .2s;margin-bottom:14px}
.login-input:focus{border-color:var(--navy);background:#fff}
.login-btn{width:100%;padding:14px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-family:"Cairo",sans-serif;font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s;margin-bottom:12px}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.parent-link{text-align:center;padding:12px 24px;border-top:1px solid var(--line);background:#f8f9fc}
.parent-link a{color:var(--sky);font-size:13px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.login-footer{text-align:center;padding:10px 24px 16px}
.login-footer a{font-size:12px;color:var(--mid);text-decoration:none;font-weight:700}
.system-brand{margin-top:18px;color:rgba(255,255,255,.3);font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}
.install-btn{width:100%;max-width:440px;padding:12px;background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.2);border-radius:10px;font-family:"Cairo",sans-serif;font-size:13px;font-weight:800;cursor:pointer;display:none;align-items:center;justify-content:center;gap:8px;margin-top:12px}
</style>
</head>
<body>
<div class="login-card" id="login-card">
  <div class="school-header" id="school-header">
    <div class="school-logo" id="school-logo">🏫</div>
    <div class="school-name" id="school-name">المنظومة الرقمية</div>
    <div class="school-sub" id="school-sub">بوابة الدخول الآمنة</div>
    <div class="school-badge"><i class="bi bi-shield-check-fill"></i> اتصال مشفر وآمن</div>
  </div>
  <div class="login-body">
    <div class="error-msg" id="error-msg"></div>
    <label class="login-label">رقم المستخدم</label>
    <input type="text" class="login-input" id="inp-id" placeholder="أدخل رقمك..." autocomplete="username">
    <label class="login-label">كلمة المرور</label>
    <input type="password" class="login-input" id="inp-pass" placeholder="••••••••" autocomplete="current-password">
    <button class="login-btn" id="login-btn" onclick="doLogin()">
      <i class="bi bi-box-arrow-in-left"></i> تسجيل الدخول
    </button>
  </div>
  <div class="parent-link">
    <a href="parent-login.html"><i class="bi bi-person-heart"></i> بوابة ولي الأمر — دخول / تسجيل جديد</a>
  </div>
  <div class="login-footer">
    <a href="privacy.html"><i class="bi bi-shield-lock"></i> سياسة الخصوصية</a>
  </div>
</div>
<button class="install-btn" id="install-btn"><i class="bi bi-phone-fill"></i> ثبّت التطبيق</button>
<div class="system-brand"><i class="bi bi-grid-3x3-gap-fill"></i> المنظومة الرقمية © 2026</div>
<script type="module">
import { db, auth } from './js/firebase-config.js';
import { getDoc, doc, collection, query, where, getDocs, orderBy } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js';
import { signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
const urlParams = new URLSearchParams(window.location.search);
const schoolFromUrl = urlParams.get('school')?.trim().toLowerCase() || '';
const fns = getFunctions(auth.app, 'me-central1');
const loginUserFn = httpsCallable(fns, 'loginUser');
async function loadSchoolBranding() {
  if (!schoolFromUrl) return;
  try {
    const snap = await getDoc(doc(db, 'schools', schoolFromUrl));
    if (!snap.exists()) return;
    const s = snap.data();
    document.getElementById('school-name').textContent = s.name || 'المدرسة';
    document.getElementById('school-sub').textContent = s.region || 'وزارة التربية — الكويت';
    document.title = 'دخول | ' + (s.name || '');
    if (s.primaryColor) {
      document.documentElement.style.setProperty('--navy', s.primaryColor);
      document.getElementById('school-header').style.background = s.primaryColor;
      document.getElementById('login-btn').style.background = s.primaryColor;
      document.body.style.background = s.primaryColor;
    }
    if (s.logoUrl) {
      document.getElementById('school-logo').innerHTML = '<img src="' + s.logoUrl + '" alt="' + (s.name||'') + '" onerror="this.parentElement.textContent=\'🏫\'">';
    }
  } catch(e) {}
}
window.doLogin = async function() {
  const id = document.getElementById('inp-id').value.trim();
  const pass = document.getElementById('inp-pass').value.trim();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('error-msg');
  err.classList.remove('show');
  if (!id || !pass) { err.textContent = '⚠️ أدخل رقم المستخدم وكلمة المرور'; err.classList.add('show'); return; }
  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-hourglass-split"></i> جاري التحقق...';
  try {
    const result = await loginUserFn({ schoolId: schoolFromUrl || null, userId: id, password: pass });
    const userData = result.data;
    await signInWithCustomToken(auth, userData.token);
    const schoolSnap = await getDoc(doc(db, 'schools', userData.schoolId));
    const schoolData = schoolSnap.exists() ? schoolSnap.data() : {};
    localStorage.setItem('hs_user', JSON.stringify({ userId: id, name: userData.name||'', role: userData.role||'', schoolId: userData.schoolId, schoolName: schoolData.name||'', classId: userData.classId||'', primaryColor: schoolData.primaryColor||'' }));
    const role = String(userData.role||'').trim().toLowerCase();
    const adminRoles = ['admin','assistant_manager','wing_supervisor'];
    const dest = adminRoles.includes(role) ? 'admin.html' : role === 'social_worker' ? 'social.html' : role === 'guard' ? 'guard.html' : role === 'nurse' ? 'nurse.html' : role === 'department_head' ? 'department_head.html' : 'teacher.html';
    window.location.replace(dest);
  } catch(errObj) {
    const msgs = { 'functions/unauthenticated': '❌ بيانات الدخول غير صحيحة', 'functions/not-found': '❌ المستخدم غير موجود', 'functions/resource-exhausted': '⏳ تجاوزت المحاولات، انتظر قليلاً', 'functions/invalid-argument': '⚠️ أدخل البيانات بشكل صحيح' };
    err.textContent = msgs[errObj.code] || ('❌ ' + (errObj.message || 'حدث خطأ، حاول مرة أخرى'));
    err.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-box-arrow-in-left"></i> تسجيل الدخول';
  }
};
document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  const btn = document.getElementById('install-btn');
  btn.style.display = 'flex';
  btn.onclick = async () => { e.prompt(); await e.userChoice; btn.style.display = 'none'; };
});
loadSchoolBranding();
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
</body>
</html>
