name: Fix Arabic Encoding
on:
  push:
    branches: [main]
jobs:
  fix-encoding:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install chardet
        run: pip install chardet -q
      - name: Fix encoding
        run: python3 .github/fix_encoding.py
      - name: Commit fixes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto: fix Arabic encoding"
          git push