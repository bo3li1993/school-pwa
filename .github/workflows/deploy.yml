name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ══════════════════════════════════════════════
  # 1. Firestore Rules Tests (Emulator)
  # ══════════════════════════════════════════════
  test-rules:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Java (required for Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Firebase Emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase.json') }}
          restore-keys: firebase-emulators-

      - name: Run Firestore Rules Tests
        run: |
          firebase emulators:exec \
            --only firestore \
            --project hosainan-school \
            "cd firestore-tests && npm ci && npm test"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ══════════════════════════════════════════════
  # 2. Security Scan (منع كلمات خطرة في الكود)
  # ══════════════════════════════════════════════
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for dangerous patterns
        run: |
          echo "🔍 فحص الأنماط الخطرة..."
          FOUND=0

          # منع كلمات مرور plaintext
          if grep -r "plainPass\|plain_pass\|password123\|admin123" functions/index.js 2>/dev/null; then
            echo "❌ كلمة مرور plaintext مكشوفة!"
            FOUND=1
          fi

          # منع SHA256 لكلمات المرور
          if grep -r "sha256.*password\|password.*sha256" functions/index.js 2>/dev/null; then
            echo "❌ SHA256 غير آمن لكلمات المرور!"
            FOUND=1
          fi

          # منع Firebase API keys مكشوفة
          if grep -r "AAAA[A-Za-z0-9_-]{7}" functions/ 2>/dev/null; then
            echo "❌ Firebase Server Key مكشوف!"
            FOUND=1
          fi

          # تحقق من وجود schoolId isolation
          QUERIES=$(grep -c "collection(db" functions/index.js 2>/dev/null || echo 0)
          ISOLATED=$(grep -c "where.*schoolId" functions/index.js 2>/dev/null || echo 0)
          echo "📊 Firestore queries: $QUERIES | مع schoolId: $ISOLATED"

          if [ $FOUND -eq 1 ]; then
            exit 1
          fi
          echo "✅ Security scan passed"

  # ══════════════════════════════════════════════
  # 3. Validate Firestore Rules Syntax
  # ══════════════════════════════════════════════
  validate-rules:
    name: Validate Firestore Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Validate rules syntax
        run: firebase firestore:rules --check firestore.rules --project hosainan-school
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ══════════════════════════════════════════════
  # 4. Deploy (فقط على main بعد نجاح كل الاختبارات)
  # ══════════════════════════════════════════════
  deploy:
    name: Deploy to Firebase
    needs: [test-rules, security-scan, validate-rules]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: cd functions && npm ci

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: hosainan-school
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
