name: CI Check

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate key files
        run: |
          test -f index.html && echo "index.html OK"
          test -f admin.html && echo "admin.html OK"
          test -f teacher.html && echo "teacher.html OK"
          test -f parent.html && echo "parent.html OK"
          test -f department_head.html && echo "department_head.html OK"
          test -f js/firebase-config.js && echo "firebase-config.js OK"
          test -f firestore.rules && echo "firestore.rules OK"
          test -f functions/index.js && echo "functions/index.js OK"
          test -f sw.js && echo "sw.js OK"
          echo "All files validated!"

      - name: Install functions dependencies
        run: cd functions && npm install --ignore-scripts

      - name: Check functions syntax
        run: |
          cd functions
          node --check index.js && echo "functions/index.js syntax OK"
