name: CI Check

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Functions Dependencies
        run: cd functions && npm ci

      - name: Check functions syntax
        run: node -e "require('./functions/index.js')" || true
