name: CI Check

on:
  push:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate key files
        run: |
          test -f index.html && echo "index.html OK"
          test -f admin.html && echo "admin.html OK"
          test -f js/firebase-config.js && echo "firebase-config.js OK"
          test -f firestore.rules && echo "firestore.rules OK"
          test -f functions/index.js && echo "functions/index.js OK"

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Check functions syntax
        run: cd functions && node --check index.js && echo "Syntax OK"

      - name: Security - no passHash written from browser
        run: |
          if grep -RIn "passHash.*sha256\|sha256.*passHash\|await sha256Hash" . --exclude-dir=.git --exclude-dir=node_modules --include="*.js" --include="*.html"; then
            echo "ERROR: SHA-256 passHash in browser code!"
            exit 1
          fi
          echo "passHash check OK"

      - name: Security - no hardcoded secrets
        run: |
          if grep -RIn "husainan@2026" . --exclude-dir=.git --exclude-dir=node_modules --include="*.js" --include="*.html"; then
            echo "ERROR: Hardcoded secret!"
            exit 1
          fi
          echo "Secrets OK"

      - name: Security - no SHA-256 hashing
        run: |
          if grep -RIn "createHash.*sha256\|sha256.*createHash" . --exclude-dir=.git --exclude-dir=node_modules --include="*.html"; then
            echo "ERROR: SHA-256 in browser code!"
            exit 1
          fi
          if grep -RIn "passHash.*sha256\|sha256.*passHash" functions/index.js; then
            echo "ERROR: SHA-256 password hashing!"
            exit 1
          fi
          echo "SHA-256 OK"

      - name: Security - no custom token storage
        run: |
          if grep -RIn "setItem.*hs_custom_token\|hs_custom_token.*setItem" . --exclude-dir=.git --exclude-dir=node_modules --include="*.js" --include="*.html"; then
            echo "ERROR: Custom token stored!"
            exit 1
          fi
          echo "Token OK"

      - name: Install Firebase Tools
        run: npm install -g firebase-tools
      - name: Validate Firestore Rules
        run: |
          node -e "const fs=require('fs'); const r=fs.readFileSync('firestore.rules','utf8'); if(r.includes('allow read, write: if false') && r.includes('isSuperAdmin') && r.includes('superadmin == true') && r.includes('userSchool()')) { console.log('Rules OK'); } else { console.error('Rules check failed'); process.exit(1); }"
      - name: Security - no plainPass in functions
        run: |
          if grep -RIn "plainPass" functions/index.js; then
            echo "ERROR: plainPass found in production!"
            exit 1
          fi
          echo "plainPass OK"
      - name: All checks passed
        run: echo "CI passed!"
