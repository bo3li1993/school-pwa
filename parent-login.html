<script type="module">
import { auth } from './js/firebase-config.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js';
import { signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

const fns = getFunctions(auth.app, 'me-central1');
const loginParentFn = httpsCallable(fns, 'loginParent');
const db2 = getFirestore(auth.app);

const urlParams = new URLSearchParams(window.location.search);
const schoolFromUrl = urlParams.get('school')?.trim().toLowerCase() || '';
if (schoolFromUrl) {
    document.getElementById('inp-school').value = schoolFromUrl;
    document.getElementById('inp-school').readOnly = true;
    loadSchoolName(schoolFromUrl);
}

const saved = localStorage.getItem('hs_parent');
if (saved) {
    try { JSON.parse(saved); window.location.replace('parent.html'); } catch(e) {}
}

async function loadSchoolName(sid) {
    try {
        const snap = await getDoc(doc(db2, 'schools', sid));
        if (snap.exists()) document.getElementById('school-name-header').textContent = snap.data().name || sid;
    } catch(e) {}
}

function showErr(msg) {
    const el = document.getElementById('err-login');
    el.textContent = msg;
    el.classList.add('show');
}

window.doLogin = async function() {
    document.getElementById('err-login').classList.remove('show');
    const schoolId = document.getElementById('inp-school').value.trim().toLowerCase();
    const civilId = document.getElementById('inp-civil').value.trim();
    const pass = document.getElementById('inp-pass').value;

    if (!schoolId || !civilId || !pass) return showErr('† #CED ,EJ9 'D-BHD');

    const btn = document.getElementById('btn-login');
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-hourglass-split"></i> ,'1J 'D*-BB...';

    try {
        const result = await loginParentFn({ schoolId, civilId, password: pass });
        const data = result.data;

        await signInWithCustomToken(auth, data.token);

        localStorage.setItem('hs_parent', JSON.stringify({
            userId: data.userId,
            civilId,
            role: 'parent',
            schoolId: data.schoolId,
            schoolName: data.schoolName || '',
            studentName: data.studentName || '',
            studentId: data.studentId || '',
            classId: data.classId || ''
        }));

        window.location.replace('parent.html');

    } catch(e) {
        const msgs = {
            'functions/unauthenticated': 'L CDE) 'DE1H1 :J1 5-J-)',
            'functions/not-found': 'L 'D-3'( :J1 EH,H/  3,QD #HD'K',
            'functions/resource-exhausted': 'Û ' + (e.message || '*,'H2* 'DE-'HD'* 'F*81 BDJD'K'),
            'functions/invalid-argument': '† #/.D 'D(J'F'* (4CD 5-J-'
        };
        showErr(msgs[e.code] || ('L ' + (e.message || '-/+ .7# -'HD E1) #.1I')));
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-left"></i> *3,JD 'D/.HD';
    }
};

window.goRegister = function() {
    const sid = document.getElementById('inp-school').value.trim();
    window.location.href = 'register-parent.html' + (sid ? '?school='+sid : '');
};

document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
