<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بوابة المعلم — المنظومة الرقمية</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2545">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2545;--sky:#1a78c2;--gold:#d4920a;--green:#16a34a;--red:#dc2626;--off:#f8f9fc;--line:#e5e7eb;--mid:#6b7280;--text:#111827}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--off);color:var(--text);min-height:100vh;padding-bottom:80px;font-size:15px}
.topbar{background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:30}
.topbar h1{font-size:14px;font-weight:800}
.topbar p{font-size:11px;opacity:.7}
.topbar button{background:rgba(255,255,255,.12);color:#fff;border:none;padding:7px 14px;border-radius:8px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;cursor:pointer}
.page{display:none;padding:16px;max-width:600px;margin:0 auto}
.page.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:900;color:var(--navy);margin-bottom:10px}
.card label{font-size:12px;font-weight:800;color:var(--mid);display:block;margin-bottom:4px}
.card input,.card select,.card textarea{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;font-family:'Cairo',sans-serif;font-size:14px;outline:none;margin-bottom:10px}
.card input:focus,.card select:focus,.card textarea:focus{border-color:var(--sky)}
.btn{width:100%;padding:11px;border:none;border-radius:10px;font-family:'Cairo',sans-serif;font-weight:800;font-size:14px;cursor:pointer;color:#fff}
.btn-navy{background:var(--navy)}
.btn-sky{background:var(--sky)}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-gold{background:var(--gold)}
.status-grid{display:grid;gap:8px;margin-top:10px}
.student-row{display:flex;align-items:center;justify-content:space-between;padding:10px;background:var(--off);border-radius:10px;border:1.5px solid var(--line)}
.student-row .name{font-weight:800;font-size:13px;flex:1}
.student-row .btns{display:flex;gap:4px}
.student-row .btns button{border:none;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif}
.student-row .btns .present{background:#dcfce7;color:#16a34a}
.student-row .btns .absent{background:#fee2e2;color:#dc2626}
.student-row .btns .late{background:#fef3c7;color:#d97706}
.student-row .btns .active{outline:3px solid var(--navy);outline-offset:1px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-family:'Cairo',sans-serif;font-size:10px;font-weight:800;color:var(--mid);cursor:pointer}
.nav-btn i{font-size:20px}
.nav-btn.active{color:var(--sky)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:10px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;z-index:9999;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.2);transition:opacity .4s;white-space:nowrap}
.empty{text-align:center;padding:30px;color:#aaa;font-weight:700;font-size:13px}
@media(max-width:400px){.student-row .btns button{padding:4px 7px;font-size:10px} .topbar h1{font-size:12px}}
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
    <div>
        <h1 id="topbar-name">🏫 بوابة المعلم</h1>
        <p id="topbar-school"></p>
    </div>
    <button onclick="doLogout()"><i class="bi bi-box-arrow-left"></i> خروج</button>
</div>

<!-- ═══ صفحة الغياب ═══ -->
<div class="page active" id="page-attendance">
    <div class="card">
        <h2>✏️ تسجيل حضور وغياب الفصل</h2>
        <label>اختر الفصل</label>
        <select id="sel-class" onchange="onClassChange(this.value)">
            <option value="">-- اختر الفصل --</option>
        </select>
        <label>الحصة</label>
        <select id="sel-period">
            <option>الحصة الأولى</option><option>الحصة الثانية</option><option>الحصة الثالثة</option>
            <option>الحصة الرابعة</option><option>الحصة الخامسة</option><option>الحصة السادسة</option>
        </select>
        <div id="students-list"></div>
        <div id="save-section" style="display:none;margin-top:12px">
            <button class="btn btn-navy" id="save-btn" onclick="saveAttendance()">
                <i class="bi bi-cloud-upload-fill"></i> حفظ ورفع سجل الحضور
            </button>
        </div>
    </div>
</div>

<!-- ═══ صفحة سجلّي ═══ -->
<div class="page" id="page-mylog">
    <div class="card">
        <h2><i class="bi bi-journal-check" style="color:var(--sky)"></i> سجل الغياب اللي سجّلته</h2>
        <label>التاريخ</label>
        <input type="date" id="mylog-date" onchange="loadMyLog()">
        <div id="mylog-content"><div class="empty">اختر تاريخ لعرض السجل</div></div>
    </div>
</div>

<!-- ═══ صفحة ملاحظات ═══ -->
<div class="page" id="page-notes">
    <div class="card">
        <h2><i class="bi bi-pencil-square" style="color:var(--gold)"></i> ملاحظات على الطلاب</h2>
        <label>الفصل</label>
        <select id="note-class" onchange="loadNoteStudents()"><option value="">اختر الفصل</option></select>
        <label>الطالب</label>
        <select id="note-student"><option value="">اختر الطالب</option></select>
        <label>الملاحظة</label>
        <textarea id="note-text" rows="3" placeholder="اكتب ملاحظتك..."></textarea>
        <button class="btn btn-navy" onclick="saveStudentNote()"><i class="bi bi-check-circle-fill"></i> حفظ الملاحظة</button>
    </div>
    <div id="notes-list"><div class="empty">لا توجد ملاحظات</div></div>
</div>

<!-- ═══ صفحة بياناتي ═══ -->
<div class="page" id="page-profile">
    <div class="card">
        <h2><i class="bi bi-person-gear" style="color:var(--sky)"></i> بياناتي</h2>
        <label>الاسم الكامل</label>
        <input id="pf-name" type="text">
        <label>رقم الهاتف</label>
        <input id="pf-phone" type="tel">
        <label>القسم / التخصص</label>
        <select id="pf-dept" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;font-family:'Cairo',sans-serif;font-size:14px;margin-bottom:10px">
            <option value="">-- اختر القسم --</option>
        </select>
        <label>الرقم المدني</label>
        <input id="pf-civil" type="text">
        <label>رقم الملف</label>
        <input id="pf-filenum" type="text">
        <label>تاريخ التعيين</label>
        <input id="pf-hiredate" type="date">
        <label>البريد الإلكتروني</label>
        <input id="pf-email" type="email">
        <button class="btn btn-navy" onclick="saveProfile()"><i class="bi bi-check-circle-fill"></i> حفظ التعديلات</button>
    </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
    <button class="nav-btn active" onclick="switchPage('page-attendance',this)"><i class="bi bi-clipboard-check"></i>الغياب</button>
    <button class="nav-btn" onclick="switchPage('page-mylog',this)"><i class="bi bi-journal-check"></i>سجلّي</button>
    <button class="nav-btn" onclick="switchPage('page-notes',this)"><i class="bi bi-pencil-square"></i>ملاحظات</button>
    <button class="nav-btn" onclick="switchPage('page-profile',this)"><i class="bi bi-person-circle"></i>بياناتي</button>
</div>

<!-- ═══ JavaScript ═══ -->
<script type="module">
import { db, getActiveSchoolId, getTodayISO } from './js/firebase-config.js';
import { collection, getDocs, addDoc, deleteDoc, doc, query, where, writeBatch, serverTimestamp }
    from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

// ── Auth ──
const saved = localStorage.getItem('hs_user');
if(!saved) { window.location.replace('index.html'); }
let me = {};
try {
    me = JSON.parse(saved);
    const allowed = ['teacher','social_worker'];
    if(!me || !allowed.includes(String(me.role||'').trim().toLowerCase())) {
        if(['admin','assistant_manager','wing_supervisor'].includes(String(me.role||'')))
            window.location.replace('admin.html');
        else
            window.location.replace('index.html');
    }
    document.getElementById('topbar-name').textContent = '🏫 بوابة المعلم — ' + (me.name||'');
    document.getElementById('topbar-school').textContent = me.schoolName || '';
} catch(e) { window.location.replace('index.html'); }

const schoolId = getActiveSchoolId();
const today = getTodayISO();

// تحديث الـ role من Firestore — لو المدير غيّره
(async function() {
    try {
        const snap = await getDocs(query(collection(db,'users'), where('schoolId','==',schoolId), where('userId','==',me.userId)));
        if(!snap.empty) {
            const fresh = snap.docs[0].data();
            const newRole = String(fresh.role||'').trim().toLowerCase();
            if(newRole !== me.role) {
                me.role = newRole;
                me.name = fresh.name || me.name;
                localStorage.setItem('hs_user', JSON.stringify(me));
                // لو صار admin/مشرف → يروح admin.html
                if(['admin','assistant_manager','wing_supervisor'].includes(newRole)) {
                    window.location.replace('admin.html'); return;
                }
                // لو صار دور ثاني مو معلم
                if(!['teacher','social_worker'].includes(newRole)) {
                    window.location.replace('index.html'); return;
                }
            }
        }
    } catch(e) {}
})();

// ── Navigation ──
window.switchPage = function(pageId, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(pageId)?.classList.add('active');
    if(btn) btn.classList.add('active');
    if(pageId === 'page-mylog') { document.getElementById('mylog-date').value = today; loadMyLog(); }
    if(pageId === 'page-notes') loadMyNotes();
    if(pageId === 'page-profile') loadProfile();
};

window.doLogout = function() { localStorage.removeItem('hs_user'); localStorage.removeItem('hs_custom_token'); window.location.replace('index.html'); };

// ── Toast ──
window.showToast = function(msg, type) {
    document.querySelectorAll('.toast').forEach(t=>t.remove());
    const t = document.createElement('div');
    t.className = 'toast';
    t.style.background = type==='error'?'#dc2626':type==='warning'?'#d97706':'#059669';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),400)},2500);
};

// ══════════════════════════════════════════
// 1. تسجيل الغياب
// ══════════════════════════════════════════
let studentStatuses = {};
let allStudentsLoaded = [];

// تحميل الفصول
(async function() {
    try {
        const snap = await getDocs(query(collection(db,'students'), where('schoolId','==',schoolId)));
        const classes = [...new Set(snap.docs.map(d=>d.data().classId).filter(Boolean))].sort((a,b)=>{
            const pa=a.split('/'),pb=b.split('/');
            return (parseInt(pa[0])||0)-(parseInt(pb[0])||0)||(parseInt(pa[1])||0)-(parseInt(pb[1])||0);
        });
        const sel = document.getElementById('sel-class');
        sel.innerHTML = '<option value="">-- اختر الفصل --</option>' + classes.map(c=>`<option value="${c}">${c}</option>`).join('');

        // نفس الفصول في الملاحظات
        document.getElementById('note-class').innerHTML = '<option value="">اختر الفصل</option>' + classes.map(c=>`<option value="${c}">${c}</option>`).join('');
    } catch(e) { console.error('Load classes:', e); }
})();

window.onClassChange = async function(classId) {
    const list = document.getElementById('students-list');
    const saveSection = document.getElementById('save-section');
    if(!classId) { list.innerHTML = ''; saveSection.style.display = 'none'; return; }

    list.innerHTML = '<div class="empty">⏳ جاري التحميل...</div>';
    studentStatuses = {};
    allStudentsLoaded = [];

    try {
        const snap = await getDocs(query(collection(db,'students'), where('schoolId','==',schoolId), where('classId','==',classId)));
        allStudentsLoaded = snap.docs.map(d=>d.data().name).filter(Boolean).sort((a,b)=>a.localeCompare(b,'ar'));

        if(!allStudentsLoaded.length) { list.innerHTML = '<div class="empty">لا يوجد طلاب في هذا الفصل</div>'; return; }

        list.innerHTML = '<div class="status-grid">' + allStudentsLoaded.map(name => {
            studentStatuses[name] = 'present';
            return `<div class="student-row">
                <span class="name">${name}</span>
                <div class="btns" id="btns-${name.replace(/\s/g,'_')}">
                    <button class="present active" onclick="setStatus('${name.replace(/'/g,"\'")}','present',this.parentElement)">حاضر</button>
                    <button class="absent" onclick="setStatus('${name.replace(/'/g,"\'")}','absent',this.parentElement)">غائب</button>
                    <button class="late" onclick="setStatus('${name.replace(/'/g,"\'")}','late',this.parentElement)">متأخر</button>
                </div>
            </div>`;
        }).join('') + '</div>';
        saveSection.style.display = 'block';
    } catch(e) { list.innerHTML = '<div class="empty">❌ '+e.message+'</div>'; }
};

window.setStatus = function(name, status, btnsEl) {
    studentStatuses[name] = status;
    btnsEl.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    btnsEl.querySelector('.'+status)?.classList.add('active');
};

window.saveAttendance = async function() {
    const classId = document.getElementById('sel-class').value;
    const period = document.getElementById('sel-period').value;
    if(!classId) { showToast('اختر الفصل أولاً','warning'); return; }

    const saveBtn = document.getElementById('save-btn');
    saveBtn.disabled = true;
    saveBtn.innerHTML = '⏳ جاري الحفظ...';

    try {
        const batch = writeBatch(db);
        // نسجّل الغائبين والمتأخرين فقط
        allStudentsLoaded.filter(n => studentStatuses[n] && studentStatuses[n] !== 'present').forEach(name => {
            const ref = doc(collection(db,'attendance'));
            batch.set(ref, {
                schoolId, classId, period,
                studentName: name,
                date: today,
                status: studentStatuses[name],
                recordedBy: me.name || '',
                createdAt: serverTimestamp()
            });
        });
        await batch.commit();

        showToast('✅ تم حفظ الغياب بنجاح');

        document.getElementById('sel-class').value = '';
        document.getElementById('students-list').innerHTML = '';
        document.getElementById('save-section').style.display = 'none';
        studentStatuses = {};
        allStudentsLoaded = [];

    } catch(e) {
        showToast('❌ خطأ في الحفظ: ' + e.message, 'error');
    } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="bi bi-cloud-upload-fill"></i> حفظ ورفع سجل الحضور';
    }
};

// ══════════════════════════════════════════
// 2. سجلّي
// ══════════════════════════════════════════
window.loadMyLog = async function() {
    const date = document.getElementById('mylog-date')?.value;
    if(!date) return;
    const content = document.getElementById('mylog-content');
    content.innerHTML = '<div class="empty">⏳ جاري التحميل...</div>';

    try {
        const snap = await getDocs(query(collection(db,'attendance'), where('schoolId','==',schoolId), where('date','==',date)));
        const records = snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.recordedBy===(me.name||''));

        if(!records.length) { content.innerHTML = '<div class="empty">📭 لا يوجد سجلات لهذا اليوم</div>'; return; }

        records.sort((a,b)=>{
            const pa=(a.classId||'').split('/'),pb=(b.classId||'').split('/');
            return (parseInt(pa[0])||0)-(parseInt(pb[0])||0)||(parseInt(pa[1])||0)-(parseInt(pb[1])||0)||(a.studentName||'').localeCompare(b.studentName||'','ar');
        });

        const labels = {absent:'غائب',late:'متأخر',excused:'مستأذن'};
        const colors = {absent:'#dc2626',late:'#d97706',excused:'#2563eb'};

        content.innerHTML = '<table style="width:100%;border-collapse:collapse;font-size:12px;background:#fff;border-radius:10px;overflow:hidden">' +
            '<tr style="background:#f0f4f8"><th style="padding:8px;text-align:right">الطالب</th><th style="padding:8px;text-align:center">الفصل</th><th style="padding:8px;text-align:center">الحالة</th><th style="padding:8px;text-align:center">الحصة</th><th style="padding:8px">إجراء</th></tr>' +
            records.map(r =>
                `<tr style="border-bottom:1px solid #f0f2f5"><td style="padding:8px;font-weight:700">${r.studentName}</td>` +
                `<td style="padding:8px;text-align:center">${r.classId}</td>` +
                `<td style="padding:8px;text-align:center;color:${colors[r.status]||'#666'};font-weight:800;font-size:11px">${labels[r.status]||r.status}</td>` +
                `<td style="padding:8px;text-align:center">${r.period||'-'}</td>` +
                `<td style="padding:8px"><button onclick="deleteRecord('${r.id}')" style="background:#fee2e2;color:#dc2626;border:none;padding:4px 8px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer">حذف</button></td></tr>`
            ).join('') + '</table>';
    } catch(e) { content.innerHTML = '<div class="empty">❌ '+e.message+'</div>'; }
};

window.deleteRecord = async function(id) {
    if(!confirm('حذف هذا السجل؟')) return;
    try {
        await deleteDoc(doc(db,'attendance',id));
        showToast('✅ تم الحذف');
        loadMyLog();
    } catch(e) { showToast('❌ '+e.message,'error'); }
};

// ══════════════════════════════════════════
// 3. ملاحظات على الطلاب
// ══════════════════════════════════════════
window.loadNoteStudents = async function() {
    const classId = document.getElementById('note-class')?.value;
    const sel = document.getElementById('note-student');
    if(!classId||!sel) return;
    try {
        const snap = await getDocs(query(collection(db,'students'), where('schoolId','==',schoolId), where('classId','==',classId)));
        const students = snap.docs.map(d=>d.data().name).filter(Boolean).sort((a,b)=>a.localeCompare(b,'ar'));
        sel.innerHTML = '<option value="">اختر الطالب</option>' + students.map(n=>`<option value="${n}">${n}</option>`).join('');
    } catch(e) {}
};

window.saveStudentNote = async function() {
    const classId = document.getElementById('note-class')?.value;
    const student = document.getElementById('note-student')?.value;
    const text = document.getElementById('note-text')?.value?.trim();
    if(!classId||!student||!text) { showToast('اختر الفصل والطالب واكتب الملاحظة','warning'); return; }

    try {
        await addDoc(collection(db,'student_notes'), {
            schoolId, classId, studentName: student,
            note: text, teacherName: me.name||'', teacherId: me.userId||'',
            date: today, createdAt: serverTimestamp()
        });
        document.getElementById('note-text').value = '';
        showToast('✅ تم حفظ الملاحظة');
        loadMyNotes();
    } catch(e) { showToast('❌ '+e.message,'error'); }
};

window.loadMyNotes = async function() {
    const list = document.getElementById('notes-list');
    if(!list) return;
    try {
        const snap = await getDocs(query(collection(db,'student_notes'), where('schoolId','==',schoolId), where('teacherId','==',me.userId||'')));
        if(snap.empty) { list.innerHTML = '<div class="empty">لا توجد ملاحظات</div>'; return; }
        const notes = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
        list.innerHTML = notes.map(n =>
            `<div class="card" style="padding:12px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-weight:800;font-size:13px">${n.studentName} — ${n.classId}</span><span style="font-size:10px;color:#aaa">${n.date}</span></div><div style="font-size:12px;color:#555;line-height:1.5">${n.note}</div></div>`
        ).join('');
    } catch(e) {}
};

// ══════════════════════════════════════════
// 4. بياناتي
// ══════════════════════════════════════════
window.loadProfile = async function() {
    try {
        const snap = await getDocs(query(collection(db,'users'), where('schoolId','==',schoolId), where('userId','==',me.userId)));
        if(snap.empty) return;
        const d = snap.docs[0].data();
        document.getElementById('pf-name').value = d.name||'';
        document.getElementById('pf-phone').value = d.phone||'';
        document.getElementById('pf-dept').value = d.department||'';
        document.getElementById('pf-civil').value = d.civilId||'';
        document.getElementById('pf-filenum').value = d.fileNumber||'';
        document.getElementById('pf-hiredate').value = d.hireDate||'';
        document.getElementById('pf-email').value = d.email||'';
    } catch(e) {}
};

window.saveProfile = async function() {
    const name = document.getElementById('pf-name').value.trim();
    if(!name) { showToast('الاسم مطلوب','warning'); return; }
    try {
        const { updateDoc } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
        const snap = await getDocs(query(collection(db,'users'), where('schoolId','==',schoolId), where('userId','==',me.userId)));
        if(snap.empty) return;
        await updateDoc(snap.docs[0].ref, {
            name, phone: document.getElementById('pf-phone').value.trim(),
            department: document.getElementById('pf-dept').value.trim(),
            civilId: document.getElementById('pf-civil').value.trim(),
            fileNumber: document.getElementById('pf-filenum').value.trim(),
            hireDate: document.getElementById('pf-hiredate').value.trim(),
            email: document.getElementById('pf-email').value.trim(),
            profileCompleted: true
        });
        me.name = name; me.profileCompleted = true;
        localStorage.setItem('hs_user', JSON.stringify(me));
        document.getElementById('topbar-name').textContent = '🏫 بوابة المعلم — ' + name;
        showToast('✅ تم حفظ بياناتك');
    } catch(e) { showToast('❌ '+e.message,'error'); }
};

// ── تحميل الأقسام ──
(async function() {
    try {
        const deptSnap = await getDocs(query(collection(db,'departments'), where('schoolId','==',schoolId)));
        const depts = deptSnap.docs.map(d=>d.data().name).filter(Boolean).sort((a,b)=>a.localeCompare(b,'ar'));
        const sel = document.getElementById('pf-dept');
        if(sel && depts.length) {
            sel.innerHTML = '<option value="">-- اختر القسم --</option>' + depts.map(d=>`<option value="${d}">${d}</option>`).join('');
        }
    } catch(e) {}
})();

// ── SW ──
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
